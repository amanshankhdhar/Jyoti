plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.amanshankhdhar.jyoti'
    compileSdk 34
    defaultConfig {
        applicationId "com.amanshankhdhar.jyoti"
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName "3.0.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies { }
